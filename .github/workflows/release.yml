name: Release

# Every push to main (and manual dispatch) builds the real app, packages a
# Squirrel.Windows installer and publishes exactly one new tagged release.
# By the owner's standing decision this workflow runs no test or lint gate;
# release notes say so plainly.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record workflow start time
        shell: bash
        run: |
          started=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .run_started_at)
          echo "MT_STARTED=$started" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check dependency inventory
        shell: bash
        run: |
          node --version && npm --version && git --version && gh --version | head -1
          test -f package-lock.json || { echo "Missing dependency: package-lock.json"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Compute version and dim sum code name
        shell: bash
        run: |
          version="1.0.${{ github.run_number }}"
          echo "MT_VERSION=$version" >> "$GITHUB_ENV"
          node -e "const f='package.json';const p=require('./'+f);p.version='$version';require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          dish=$(node scripts/resolve-dimsum.mjs)
          echo "$dish"
          echo "MT_CODENAME=$(echo "$dish" | node -pe "JSON.parse(require('fs').readFileSync(0)).codeName||''")" >> "$GITHUB_ENV"
          echo "MT_PHOTO_URL=$(echo "$dish" | node -pe "JSON.parse(require('fs').readFileSync(0)).photoUrl||''")" >> "$GITHUB_ENV"
          prev=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' || true)
          if [ -n "$prev" ]; then echo "MT_REMOTE_RELEASES=https://github.com/${{ github.repository }}" >> "$GITHUB_ENV"; fi

      - name: Generate icons
        run: npm run icons

      - name: Build
        run: npm run build

      - name: Capture screenshots of the built app
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p out/screenshots
          MT_CAPTURE_DIR="$PWD/out/screenshots" node scripts/capture.mjs || true
          ls out/screenshots | head -100

      - name: Package Squirrel.Windows installer
        run: npm run package:win

      - name: Count lines
        shell: bash
        run: node scripts/count-lines.mjs > out/line-counts.md

      - name: Write release notes
        shell: bash
        run: |
          {
            echo "## Material Tailscale v$MT_VERSION"
            [ -n "$MT_CODENAME" ] && echo "" && echo "**Code name:** $MT_CODENAME" && echo "" && echo "![$MT_CODENAME]($MT_PHOTO_URL)"
            echo ""
            echo "Commit: ${{ github.sha }}"
            echo ""
            echo "### Install"
            echo "Download **MaterialTailscaleSetup.exe** below and run it. The installer is **unsigned**, so Windows SmartScreen may warn about an unknown publisher. Installed copies update themselves from this release feed and ask before restarting."
            echo ""
            echo "### Checks"
            echo "This release workflow runs no automated test or lint gate. Local checks for this commit are recorded in HANDOFF.md."
            echo ""
            echo "### Changes"
            git log -1 --format='- %s'
            echo ""
            echo "### Line counts"
            cat out/line-counts.md
          } > out/notes.md

      - name: Publish release
        shell: bash
        run: |
          gh release create "v$MT_VERSION" out/installer/MaterialTailscaleSetup.exe out/installer/RELEASES out/installer/*.nupkg \
            --title "v$MT_VERSION${MT_CODENAME:+ · $MT_CODENAME}" --notes-file out/notes.md --target "${{ github.sha }}"
          if ls out/screenshots/*.png >/dev/null 2>&1; then (cd out/screenshots && zip -q ../screenshots.zip *.png) && gh release upload "v$MT_VERSION" out/screenshots.zip; fi

      - name: Append verified workflow timing
        shell: bash
        run: |
          done=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          secs=$(( $(date -u -d "$done" +%s) - $(date -u -d "$MT_STARTED" +%s) ))
          dur=$(printf '%02d:%02d:%02d' $((secs/3600)) $((secs%3600/60)) $((secs%60)))
          printf '\n### Workflow timing\n- Workflow started: %s\n- Workflow completed: %s\n- Workflow duration: %s\n' "$MT_STARTED" "$done" "$dur" >> out/notes.md
          gh release edit "v$MT_VERSION" --notes-file out/notes.md

      - name: Upload safe outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-outputs
          path: |
            out/installer/*.exe
            out/installer/RELEASES
            out/notes.md
            out/line-counts.md
            out/screenshots/*.png
          if-no-files-found: warn
