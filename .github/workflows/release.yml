name: Release

# Every push to main (and manual dispatch) builds the real app, packages a
# Squirrel.Windows installer and publishes exactly one new tagged release.
# By the owner's standing decision this workflow runs no test or lint gate;
# release notes say so plainly.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Record workflow start time
        shell: bash
        run: |
          started=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .run_started_at)
          echo "MT_STARTED=$started" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check dependency inventory
        shell: bash
        run: |
          node --version && npm --version && git --version && gh --version | head -1
          test -f package-lock.json || { echo "Missing dependency: package-lock.json"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Compute version and dim sum code name
        shell: bash
        run: |
          version="1.0.${{ github.run_number }}"
          echo "MT_VERSION=$version" >> "$GITHUB_ENV"
          node -e "const f='package.json';const p=require('./'+f);p.version='$version';require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          dish=$(node scripts/resolve-dimsum.mjs)
          echo "$dish"
          echo "MT_CODENAME=$(echo "$dish" | node -pe "JSON.parse(require('fs').readFileSync(0)).codeName||''")" >> "$GITHUB_ENV"
          echo "MT_PHOTO_URL=$(echo "$dish" | node -pe "JSON.parse(require('fs').readFileSync(0)).photoUrl||''")" >> "$GITHUB_ENV"
          prev=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' || true)
          if [ -n "$prev" ]; then echo "MT_PREVIOUS_RELEASE=$prev" >> "$GITHUB_ENV"; fi

      - name: Generate icons
        run: npm run icons

      - name: Build
        run: npm run build

      - name: Capture screenshots of the built app
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p out/screenshots
          MT_CAPTURE_DIR="$PWD/out/screenshots" node scripts/capture.mjs || true
          ls out/screenshots | head -100

      - name: Prepare output folder
        shell: bash
        run: mkdir -p out

      - name: Package Squirrel.Windows installer
        shell: bash
        run: |
          set +e
          npm run package:win > out/package.log 2>&1
          code=$?
          tail -n +1 out/package.log
          if [ "$code" -ne 0 ]; then
            echo "::error title=package (first errors)::$(grep -n -i -m 12 -E 'error|exception|failed|denied|not found' out/package.log | cut -c1-300 | tr '\n' ' ' | head -c 3000)"
            echo "::error title=package (end of log)::$(tail -c 1500 out/package.log | tr '\n' ' ')"
            exit 1
          fi

      - name: Count lines
        shell: bash
        run: mkdir -p out && node scripts/count-lines.mjs > out/line-counts.md

      - name: Publish release with notes and timing
        run: node scripts/publish-release.mjs

      - name: Upload safe outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-outputs
          path: |
            out/installer/*.exe
            out/installer/RELEASES
            out/notes.md
            out/line-counts.md
            out/screenshots/*.png
          if-no-files-found: warn

  install-proof:
    # Installs the previous release on a clean Windows runner, updates it to
    # the release just published through Squirrel's own Update.exe, checks the
    # installed versions, uninstalls, and appends the result to the notes.
    needs: release
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Install previous release, update to the new one, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tags = gh release list --limit 2 --json tagName --jq '.[].tagName'
          $new = $tags[0]; $old = $tags[1]
          $newVer = $new.TrimStart('v'); $oldVer = $old.TrimStart('v')
          $result = @()
          New-Item -ItemType Directory -Force old, new | Out-Null
          gh release download $old --pattern 'MaterialTailscaleSetup.exe' --dir old
          gh release download $new --pattern 'RELEASES' --pattern '*.nupkg' --dir new
          $sig = (Get-AuthenticodeSignature -LiteralPath old\MaterialTailscaleSetup.exe).Status
          $result += "Previous installer signature status: $sig"
          Start-Process old\MaterialTailscaleSetup.exe -ArgumentList '--silent' -Wait
          Start-Sleep -Seconds 15
          Get-Process MaterialTailscale -ErrorAction SilentlyContinue | Stop-Process -Force
          $base = Join-Path $env:LOCALAPPDATA 'MaterialTailscale'
          if (!(Test-Path (Join-Path $base "app-$oldVer\MaterialTailscale.exe"))) { throw "Install of $old did not produce app-$oldVer" }
          $result += "Installed $old silently: app-$oldVer present"
          & (Join-Path $base 'Update.exe') "--update=$((Resolve-Path new).Path)" | Out-Null
          Start-Sleep -Seconds 10
          if (!(Test-Path (Join-Path $base "app-$newVer\MaterialTailscale.exe"))) { throw "Update to $new did not produce app-$newVer" }
          $fileVer = (Get-Item (Join-Path $base "app-$newVer\MaterialTailscale.exe")).VersionInfo.ProductVersion
          $result += "Updated with Update.exe to $new`: app-$newVer present, executable reports $fileVer"
          # Photograph the updated app on the runner's desktop. Windows draws the minimise,
          # maximise and close buttons through the title-bar overlay, which an in-app capture
          # cannot see; hovering maximise should offer Snap layouts where Windows has them.
          $shots = @()
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            Add-Type -Namespace MtProof -Name Win -MemberDefinition @'
          [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
          [DllImport("user32.dll")] public static extern bool MoveWindow(IntPtr h, int x, int y, int w, int ht, bool repaint);
          [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
          [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
          [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; }
          '@
            function Save-Screen([string]$file) {
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $bmp.Save($file, [System.Drawing.Imaging.ImageFormat]::Png); $g.Dispose(); $bmp.Dispose()
            }
            $app = Start-Process (Join-Path $base "app-$newVer\MaterialTailscale.exe") -PassThru
            $hwnd = [IntPtr]::Zero
            for ($i = 0; $i -lt 60 -and $hwnd -eq [IntPtr]::Zero; $i++) { Start-Sleep -Milliseconds 500; $app.Refresh(); $hwnd = $app.MainWindowHandle }
            if ($hwnd -eq [IntPtr]::Zero) { throw 'the app opened no window within 30 seconds' }
            $area = [System.Windows.Forms.Screen]::PrimaryScreen.WorkingArea
            [MtProof.Win]::MoveWindow($hwnd, $area.Left, $area.Top, [Math]::Min($area.Width, 1280), [Math]::Min($area.Height, 800), $true) | Out-Null
            [MtProof.Win]::SetForegroundWindow($hwnd) | Out-Null
            Start-Sleep -Seconds 8
            Save-Screen "$PWD\windows-title-bar.png"; $shots += 'windows-title-bar.png'
            $r = New-Object MtProof.Win+RECT
            [MtProof.Win]::GetWindowRect($hwnd, [ref]$r) | Out-Null
            # The overlay is 44 pixels tall; maximise is the middle of the three caption buttons.
            [MtProof.Win]::SetCursorPos($r.Right - 69, $r.Top + 22) | Out-Null
            Start-Sleep -Seconds 3
            Save-Screen "$PWD\windows-maximise-hover.png"; $shots += 'windows-maximise-hover.png'
            $result += "Launched $new on the runner's desktop and photographed its title bar (windows-title-bar.png) and a hover over maximise (windows-maximise-hover.png)"
          } catch { $result += "Desktop photographs not taken: $($_.Exception.Message)" }
          if ($shots.Count) { gh release upload $new @shots --clobber }
          Get-Process MaterialTailscale -ErrorAction SilentlyContinue | Stop-Process -Force
          & (Join-Path $base 'Update.exe') --uninstall | Out-Null
          Start-Sleep -Seconds 10
          $result += "Uninstalled with Update.exe --uninstall"
          $notes = gh release view $new --json body --jq .body
          $block = "`n`n## Install and update proof (clean Windows runner)`n`n" + (($result | ForEach-Object { "- $_" }) -join "`n") + "`n"
          Set-Content -Path notes.md -Value ($notes + $block) -Encoding utf8
          gh release edit $new --notes-file notes.md
          $result

  vdisk-proof:
    # Runs every virtual disk operation of the app's own disk script on a clean Windows
    # runner (create, attach, detach, grow, shrink, compact, convert, differencing,
    # merge, ISO and Quick pack) and appends the results to the release notes. Evidence
    # only: the release is already published and nothing waits on this job.
    needs: [release, install-proof]
    if: ${{ always() && needs.release.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Run every virtual disk operation and record the results
        shell: powershell
        run: |
          $tag = gh release list --limit 1 --json tagName --jq '.[0].tagName'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/vdisk-proof.ps1 -Out vdisk-proof.md
          $code = $LASTEXITCODE
          $notes = gh release view $tag --json body --jq .body
          $block = "`n`n## Virtual disk proof (clean Windows runner)`n`n" + ((Get-Content vdisk-proof.md -Encoding UTF8) -join "`n") + "`n"
          Set-Content -Path notes.md -Value ($notes + $block) -Encoding utf8
          gh release edit $tag --notes-file notes.md
          exit $code
