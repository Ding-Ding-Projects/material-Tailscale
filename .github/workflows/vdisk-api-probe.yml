name: Virtual disk API probe

# Runs only for probe/* branches: an experiment on a hosted Windows runner that records which
# virtual disk API calls work without Hyper-V. It publishes nothing.
on:
  push:
    branches: ['probe/**']

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: The app's disk script, every operation
        shell: powershell
        run: |
          ./scripts/vdisk-proof.ps1 -Out vdisk-proof.md
          Get-Content vdisk-proof.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - name: VHD Set through the API with the backing storage flag, one process per variant
        if: always()
        continue-on-error: true
        shell: powershell
        run: |
          foreach ($v in 1..5) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./vdisk-api-probe.ps1 -Part vhdset-flags -Variant $v
            Write-Host "variant $v exit $LASTEXITCODE"
          }
